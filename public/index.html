<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Pro Call - Group Mesh</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3><i class="fas fa-users"></i> Thành viên</h3>
        <ul id="membersList" class="member-list"></ul>
      </div>

      <div class="sidebar-section logs-container">
        <h3><i class="fas fa-terminal"></i> Nhật ký hệ thống</h3>
        <div id="logs" class="logs"></div>
      </div>

      <div class="sidebar-footer">
        <div id="status">
          <i class="fas fa-circle"></i> Server: <span id="connStatus" class="disconnected">disconnected</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div id="registerDiv" class="auth-group">
          <input id="nameInput" type="text" placeholder="Nhập nickname của bạn..." />
          <button onclick="registerUser()" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Bắt đầu
          </button>
        </div>

        <div id="roomDiv" class="auth-group" style="display:none;">
          <input id="roomIdInput" type="text" placeholder="ID Phòng..." />
          <button onclick="createRoom()" class="btn btn-success"><i class="fas fa-plus"></i> Tạo</button>
          <button onclick="joinRoom()" class="btn btn-secondary"><i class="fas fa-door-open"></i> Vào</button>
        </div>

        <div id="callDiv" class="call-controls" style="display:none;">
          <button id="joinCallBtn" onclick="startGroupCall()" class="btn btn-call-start">
            <i class="fas fa-video"></i> Bắt đầu gọi nhóm
          </button>
          <button id="endCallBtn" onclick="leaveCall()" class="btn btn-call-end" style="display:none;">
            <i class="fas fa-phone-slash"></i> Rời cuộc gọi
          </button>
          <button id="leaveRoomBtn" onclick="leaveRoom()" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Thoát phòng
          </button>
        </div>
      </header>

      <div id="videos" class="video-grid">
        <div class="video-wrapper" id="localVideoContainer">
          <video id="localVideo" autoplay muted playsinline></video>
          <div class="video-label">Bạn (Local)</div>
        </div>
      </div>
    </main>
  </div>

  <script src="client.js"></script>
</body>
</html>
